<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | MKChat</title>
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="test.js" type="module"></script>
</head>
<body>
    <div id="root">
        <div id="sidebar">
            <span id="sidebar-room-banner">#main</span>
            <div id="sidebar-room-users">
                <div>
                    <img src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=0c0c4d5e-5b09---{}&amp;backgroundColor=transparent" alt="avatar">
                    <span>Person 0</span>
                </div>
                <div>
                    <img src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=0c50c4d5e-5b09---{}&amp;backgroundColor=transparent" alt="avatar">
                    <span>Person 1</span>
                </div>
                <div>
                    <img src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=0c20c4d5e-5b09---{}&amp;backgroundColor=transparent" alt="avatar">
                    <span>Person 2</span>
                </div>
            </div>
        </div>
        <div id="messagepane">
            <div id="messagebox"></div>
            <div id="messagecompose">
                <!--<reply-banner></reply-banner>-->
                <div id="messagemodifiers">
                    <button type="button">
                        <icon-command></icon-command>
                    </button>
                    <button type="button">
                        <icon-puzzle-piece></icon-puzzle-piece>
                    </button>
                    <button type="button">
                        <icon-folder></icon-folder>
                    </button>
                    <button type="button">
                        <icon-smiley></icon-smiley>
                    </button>
                </div>
                <form>
                    <input type="text" name="message-text" placeholder="Message #main" autocomplete="off" />
                    <button type="submit"><icon-paper-plane-right></icon-paper-plane-right></button>
                </form>
            </div>
        </div>
        <!--<div class="absolute top-0 left-0 w-full h-full bg-zinc-950 p-6">
            <upload-zone></upload-zone>
        </div>-->
    </div>
    <emoji-picker></emoji-picker>
</body>
</html>
